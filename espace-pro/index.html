<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .connexion { flex: 1; display: grid; place-items: center; padding: clamp(2rem, 6vw, 4rem) 1.25rem; }
  .carte-connexion {
    width: 100%; max-width: 420px; background: var(--paper);
    border: 1px solid var(--ink-100); border-radius: 20px; box-shadow: var(--shadow-md);
    padding: clamp(1.6rem, 5vw, 2.4rem);
  }
  .carte-connexion .eyebrow { color: var(--teal-700); }
  .carte-connexion .eyebrow::before { background: var(--teal-700); }
  .carte-connexion h1 {
    font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
    font-size: clamp(1.6rem, 5vw, 2rem); letter-spacing: .04em; color: var(--teal-900); line-height: 1.1;
  }
  .carte-connexion .intro { color: var(--ink-500); font-size: .93rem; margin: .6rem 0 1.6rem; line-height: 1.6; }
  .champ { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }
  .champ label { font-size: .85rem; font-weight: 500; color: var(--ink-700); }
  .champ input {
    font: inherit; height: 48px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--ink-100); background: var(--cream-50); color: var(--ink-900);
  }
  .champ input:focus { outline: none; border: 1.5px solid var(--teal-700); box-shadow: 0 0 0 3px var(--teal-100); background: #fff; }
  .souvenir { display: flex; align-items: center; gap: .6rem; font-size: .88rem; color: var(--ink-700); margin-bottom: 1.4rem; cursor: pointer; }
  .souvenir input { width: 18px; height: 18px; accent-color: var(--teal-700); }
  .btn-connexion {
    width: 100%; height: 50px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--teal-700); color: #fff; font: inherit; font-weight: 600; font-size: 1rem;
    transition: background .2s;
  }
  .btn-connexion:hover { background: var(--teal-800); }
  .btn-connexion:disabled { opacity: .6; cursor: progress; }
  .erreur { color: #B43B3B; font-size: .88rem; min-height: 1.4em; margin-top: .8rem; text-align: center; }
  .note { margin-top: 1.4rem; padding-top: 1.1rem; border-top: 1px solid var(--ink-100); font-size: .82rem; color: var(--ink-500); line-height: 1.6; }
  .note a { color: var(--teal-700); }
</style>

const CLE_STOCKEE = "biolle-espace-pro";

const octets = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const versB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function deriverCle(mdp) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: octets(DONNEES.sel), iterations: DONNEES.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
  );
}

async function dechiffrer(cle) {
  const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: octets(DONNEES.iv) }, cle, octets(DONNEES.data));
  return new TextDecoder().decode(clair);
}

// La page déchiffrée remplace la page de connexion
function ouvrir(html) {
  document.open();
  document.write(html);
  document.close();
}

function lireStockage() {
  try { return sessionStorage.getItem(CLE_STOCKEE) || localStorage.getItem(CLE_STOCKEE); } catch (e) { return null; }
}
function ecrireStockage(valeur, durable) {
  try {
    sessionStorage.setItem(CLE_STOCKEE, valeur);
    if (durable) localStorage.setItem(CLE_STOCKEE, valeur);
  } catch (e) { /* navigation privée : reconnexion à chaque visite */ }
}
function oublier() {
  try { sessionStorage.removeItem(CLE_STOCKEE); localStorage.removeItem(CLE_STOCKEE); } catch (e) {}
}

// Session déjà ouverte : on retente avec la clé mémorisée (invalide après une reconstruction)
(async () => {
  const stockee = lireStockage();
  if (!stockee) return;
  try {
    const cle = await crypto.subtle.importKey("raw", octets(stockee), "AES-GCM", false, ["decrypt"]);
    ouvrir(await dechiffrer(cle));
  } catch (e) { oublier(); }
})();

document.getElementById("formulaire").addEventListener("submit", async e => {
  e.preventDefault();
  const bouton = document.getElementById("valider"), erreur = document.getElementById("erreur");
  bouton.disabled = true; bouton.textContent = "Vérification…"; erreur.textContent = "";
  try {
    const cle = await deriverCle(document.getElementById("mdp").value);
    const html = await dechiffrer(cle);
    ecrireStockage(versB64(await crypto.subtle.exportKey("raw", cle)), document.getElementById("souvenir").checked);
    ouvrir(html);
  } catch (err) {
    erreur.textContent = "Mot de passe incorrect.";
    bouton.disabled = false; bouton.textContent = "Se connecter";
    document.getElementById("mdp").select();
  }
});
</script>
